name: Bug report
description: Something Red does wrong
labels: ["type/fix"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: first line of `gamemaster-red doctor` (or installed version)
      placeholder: "gamemaster-red 0.3.1 · adapter logtail-rcon · Paper 1.21.8"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: exact command/input and exact output/behavior
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: "`gamemaster-red doctor` (secrets redacted) — ARCHITECTURE.md §12.6"
      render: text
