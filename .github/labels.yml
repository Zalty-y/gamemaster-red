# Canonical label set. Sync with:  gh label sync --file .github/labels.yml
# One area/* per commit scope, one type/* per relevant commit type — the
# vocabulary in CONTRIBUTING.md is the source of truth; these are its GitHub
# projections so an agent can `gh issue create --label area/schema,type=feat`
# without inventing strings.

- name: "type/feat"
  color: "a2eeef"
  description: "New user-visible capability (release: minor)"
- name: "type/fix"
  color: "d73a4a"
  description: "Wrong behavior being fixed (release: patch)"
- name: "type/perf"
  color: "006b75"
  description: "Performance work"
- name: "type/docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type/chore"
  color: "cccccc"
  description: "Tooling, CI, deps, refactors — no user-visible change"

- name: "area/service"
  color: "1d76db"
  description: "Core pipeline, sessions, memory, triggers"
- name: "area/adapter-logtail"
  color: "1d76db"
  description: "Log-tail + RCON adapter"
- name: "area/adapter-bridge"
  color: "1d76db"
  description: "Paper bridge plugin (plugin-paper/)"
- name: "area/schema"
  color: "5319e7"
  description: "Envelope schema — wire contract, cross-cutting"
- name: "area/tools"
  color: "1d76db"
  description: "Wiki lookup, crafting KB, MCP, tool API"
- name: "area/config"
  color: "1d76db"
  description: "init / setup / doctor / wizard / config writers"
- name: "area/docker"
  color: "1d76db"
  description: "Dockerfile, compose.yml, compose.demo.yml"
- name: "area/deps"
  color: "cccccc"
  description: "uv.lock, .python-version, dependency updates"
- name: "area/ci"
  color: "cccccc"
  description: "Workflows, hooks, release automation"
- name: "area/docs"
  color: "0075ca"
  description: "README, ARCHITECTURE.md, CONTRIBUTING.md"

- name: "good-first-issue"
  color: "7057ff"
  description: "Scoped, self-contained; a first contribution or agent task"
- name: "agent:claimed"
  color: "fbca04"
  description: "An autonomous agent is working on this right now"
